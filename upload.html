<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sean & Cindy 0530 Wedding Day | 上傳照片</title>
    <meta name="description" content="掃描QRCode上傳照片，與Sean & Cindy一同分享婚禮的歡樂時光！">

    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

    <meta property="og:title" content="Sean & Cindy 0530 Wedding Day">
    <meta property="og:description" content="掃描QRCode上傳照片，與Sean & Cindy一同分享婚禮的歡樂時光！">
    <meta property="og:type" content="website">
    <meta property="og:url" content="">
    <meta property="og:site_name" content="Sean & Cindy 0530 Wedding Day | 上傳照片">
    <meta property="og:image" content="img/og-img.webp">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        /* ── 字體（整合時換成 @font-face） ── */
        :root {
            --font-title: 'Marcellus-Regular', 'Georgia', serif;
            --font-script: 'parfumerie-script-old-style', cursive;
            --font-body: 'optima-lt-pro-roman', 'Optima', sans-serif;
            --font-zh: 'SourceHanSerifTC-Light', serif;

            --color-bg: #fbf7ee;
            --color-card: #ffffff;
            --color-gold: #c9b89e;
            --color-beige: #e6d5bf;
            --color-blue: #3f6594;
            --color-navy: #3e5477;
            --color-muted: #9aa3b1;
            --color-border: rgba(62, 84, 119, 0.15);
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            min-height: 100vh;
        }

        /* ── 頂部 ── */
        .site-header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .site-header .script-name {
            font-family: var(--font-title);
            text-transform: uppercase;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--color-navy);
            line-height: 1;
        }

        .site-header .script-name span {
            font-family: var(--font-title);
            color: var(--color-blue);
            font-size: 1.8rem;
        }

        .site-header .date-line {
            font-family: var(--font-body);
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: var(--color-muted);
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* ── 分隔線 ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 auto 24px;
            max-width: 280px;
            color: var(--color-blue);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-blue);
            opacity: 0.35;
        }

        .divider-icon {
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        /* ── 卡片 ── */
        .upload-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 2px 24px rgba(80, 60, 40, 0.07);
        }

        .upload-card .sub-text {
            font-family: var(--font-zh);
            font-size: 0.8rem;
            color: var(--color-muted);
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--color-beige);
            padding-bottom: 20px;
        }

        /* ── 拖曳區 ── */
        .drop-zone {
            border: 1.5px dashed var(--color-beige);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: background 0.2s, border-color 0.2s;
            margin-bottom: 20px;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            background: rgba(62, 84, 119, 0.05);
            border-color: var(--color-navy);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .drop-zone .drop-icon {
            font-size: 2rem;
            color: var(--color-beige);
            margin-bottom: 10px;
        }

        .drop-zone .drop-text {
            font-family: var(--font-body);
            font-size: 0.82rem;
            color: var(--color-muted);
            letter-spacing: 1px;
        }

        .drop-zone .drop-text strong {
            color: var(--color-navy);
        }

        /* ── 縮圖格 ── */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .thumb {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #e8e0d4;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(50, 35, 25, 0.65);
            color: #f0e8dc;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
        }

        .thumb-add {
            border: 1.5px dashed var(--color-beige);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--color-gold);
            cursor: pointer;
            border-radius: 8px;
            aspect-ratio: 1;
            background: transparent;
            transition: background 0.2s;
        }

        .thumb-add:hover {
            background: rgba(200, 184, 154, 0.1);
        }

        /* ── 進度條（覆寫 Bootstrap） ── */
        .progress {
            height: 3px;
            background: #e0d5c5;
            border-radius: 2px;
            margin-bottom: 16px;
        }

        .progress-bar {
            background: var(--color-blue);
            transition: width 0.3s;
        }

        /* ── 上傳按鈕 ── */
        .btn-upload {
            width: 100%;
            padding: 13px;
            background: var(--color-blue);
            color: #f0e8dc;
            border: none;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 0.82rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn-upload:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-upload:not(:disabled):hover {
            background: #2e4f78;
        }

        /* ── 狀態 ── */
        .status-msg {
            font-size: 0.78rem;
            letter-spacing: 1px;
            min-height: 20px;
            text-align: center;
            margin-top: 14px;
            font-family: var(--font-zh);
        }

        .status-msg.success {
            color: #7a9a6a;
        }

        .status-msg.error {
            color: #b06060;
        }

        .status-msg.info {
            color: var(--color-muted);
        }
    </style>
</head>

<body>
    <div id="app" class="container" style="max-width:440px;">

        <!-- 頂部標題 -->
        <div class="site-header">
            <div class="script-name">Sean <span>&</span> Cindy</div>
            <div class="date-line">2026 &nbsp;·&nbsp; 05 &nbsp;·&nbsp; 30</div>
        </div>

        <!-- 分隔線 -->
        <div class="divider">
            <span class="divider-icon">✦</span>
        </div>

        <!-- 上傳卡片 -->
        <div class="upload-card">
            <p class="sub-text">選擇照片，即時顯示在照片牆上</p>

            <!-- 拖曳區 -->
            <div class="drop-zone" :class="{ dragover: isDragOver }" @dragover.prevent="isDragOver = true"
                @dragleave="isDragOver = false" @drop.prevent="onDrop" v-if="previews.length === 0">
                <input type="file" accept="image/*" multiple @change="onFileChange" />
                <div class="drop-icon"><i class="fa-regular fa-images"></i></div>
                <div class="drop-text"><strong>點擊選擇</strong>或拖曳照片至此</div>
            </div>

            <!-- 縮圖預覽 -->
            <div v-if="previews.length > 0" class="preview-grid">
                <div v-for="(p, i) in previews" :key="i" class="thumb">
                    <img :src="p.dataUrl" />
                    <button class="remove-btn" @click="removeFile(i)" :disabled="uploading">&times;</button>
                </div>
                <label v-if="previews.length < 10" class="thumb-add">
                    <i class="fa-solid fa-plus"></i>
                    <input type="file" accept="image/*" multiple style="display:none" @change="onFileChange"
                        :disabled="uploading" />
                </label>
            </div>

            <!-- 進度條 -->
            <div v-if="uploading" class="progress">
                <div class="progress-bar" :style="{ width: progress + '%' }"></div>
            </div>

            <!-- 上傳按鈕 -->
            <button class="btn-upload" :disabled="previews.length === 0 || uploading" @click="uploadAll">
                <i v-if="uploading" class="fa-solid fa-spinner fa-spin me-2"></i>
                <i v-else class="fa-solid fa-cloud-arrow-up me-2"></i>
                <span v-if="uploading">上傳中 {{ doneCount }} / {{ previews.length }}</span>
                <span v-else-if="previews.length > 0">Upload {{ previews.length }} Photo{{ previews.length > 1 ? 's' :
                    ''
                    }}</span>
                <span v-else>Upload</span>
            </button>

            <div class="status-msg" :class="statusType">
                <i v-if="statusType === 'success'" class="fa-solid fa-circle-check me-1"></i>
                <i v-if="statusType === 'error'" class="fa-solid fa-circle-xmark me-1"></i>
                {{ statusMsg }}
            </div>
        </div>

        <div class="text-center mt-3" style="font-size:0.6rem;letter-spacing:3px;color:#c8b89a;">
            MAX 10 PHOTOS PER UPLOAD
        </div>

    </div>

    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const CLOUDINARY_CLOUD = 'dox3i7xgl';
        const CLOUDINARY_PRESET = 'hdrqkhkb';
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`;

        new Vue({
            el: '#app',
            data: {
                previews: [],
                uploading: false,
                progress: 0,
                doneCount: 0,
                isDragOver: false,
                statusMsg: '',
                statusType: 'info'
            },
            methods: {
                onFileChange(e) {
                    this.addFiles(Array.from(e.target.files));
                    e.target.value = '';
                },
                onDrop(e) {
                    this.isDragOver = false;
                    this.addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
                },
                addFiles(files) {
                    const MAX = 10;
                    const remaining = MAX - this.previews.length;
                    if (remaining <= 0) {
                        this.statusMsg = `最多一次上傳 ${MAX} 張`;
                        this.statusType = 'error';
                        return;
                    }
                    const allowed = files.slice(0, remaining);
                    if (files.length > remaining) {
                        this.statusMsg = `已超過上限，只取前 ${remaining} 張`;
                        this.statusType = 'error';
                    } else {
                        this.statusMsg = '';
                    }
                    allowed.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.previews.push({ file, dataUrl: e.target.result });
                        };
                        reader.readAsDataURL(file);
                    });
                },
                removeFile(index) {
                    this.previews.splice(index, 1);
                },
                compressImage(file) {
                    return new Promise((resolve) => {
                        const MAX_PX = 1920;
                        const MAX_MB = 2;
                        if (file.size <= MAX_MB * 1024 * 1024) return resolve(file);
                        const img = new Image();
                        const url = URL.createObjectURL(file);
                        img.onload = () => {
                            URL.revokeObjectURL(url);
                            let { width, height } = img;
                            if (width > MAX_PX || height > MAX_PX) {
                                if (width > height) { height = Math.round(height * MAX_PX / width); width = MAX_PX; }
                                else { width = Math.round(width * MAX_PX / height); height = MAX_PX; }
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width; canvas.height = height;
                            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                            canvas.toBlob(blob => resolve(blob || file), 'image/jpeg', 0.85);
                        };
                        img.src = url;
                    });
                },
                async uploadToCloudinary(file) {
                    const compressed = await this.compressImage(file);
                    const formData = new FormData();
                    formData.append('file', compressed);
                    formData.append('upload_preset', CLOUDINARY_PRESET);
                    const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                    if (!res.ok) throw new Error('Cloudinary 上傳失敗');
                    const data = await res.json();
                    return data.secure_url;
                },
                async uploadAll() {
                    if (this.previews.length === 0) return;
                    this.uploading = true;
                    this.doneCount = 0;
                    this.progress = 0;
                    this.statusMsg = '上傳中，請稍候…';
                    this.statusType = 'info';

                    try {
                        const BATCH = 3;
                        const total = this.previews.length;
                        for (let i = 0; i < total; i += BATCH) {
                            const chunk = this.previews.slice(i, i + BATCH);
                            await Promise.all(chunk.map(async ({ file }) => {
                                const url = await this.uploadToCloudinary(file);
                                await db.collection('photos').add({
                                    url,
                                    name: file.name,
                                    uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                this.doneCount++;
                                this.progress = Math.round((this.doneCount / total) * 100);
                            }));
                        }
                        this.statusMsg = `成功上傳 ${this.doneCount} 張照片！`;
                        this.statusType = 'success';
                        this.previews = [];
                    } catch (err) {
                        console.error(err);
                        this.statusMsg = '上傳失敗：' + err.message;
                        this.statusType = 'error';
                    } finally {
                        this.uploading = false;
                        this.progress = 0;
                    }
                }
            }
        });
    </script>
</body>

</html>
