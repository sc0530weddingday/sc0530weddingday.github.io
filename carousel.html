    <style>
        /* ── 字體（整合時換成 @font-face） ── */
        :root {
            --font-title: 'Marcellus-Regular', 'Georgia', serif;
            --font-script: 'parfumerie-script-old-style', cursive;
            --font-body: 'optima-lt-pro-roman', 'Optima', sans-serif;
            --font-zh: 'SourceHanSerifTC-Light', serif;

            --color-bg: #1c1e24;
            --color-cream: #e6d5bf;
            --color-gold: #c9b89e;
            --color-blue: #3f6594;
            --color-navy: #3e5477;
            --color-muted: rgba(154, 163, 177, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--color-bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-body);
        }

        /* ── 輪播 ── */
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        /* ── 暗角 ── */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(20, 18, 16, 0.65) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* ── 空狀態 ── */
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--color-bg);
        }

        .empty-state .script {
            font-family: var(--font-script);
            font-size: 3rem;
            color: var(--color-cream);
        }

        .empty-state .hint {
            font-family: var(--font-body);
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--color-muted);
            text-transform: uppercase;
        }

        /* ── 頂部列 ── */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(20, 18, 16, 0.55), transparent);
        }

        .top-bar .couple {
            font-family: var(--font-title);
            font-size: 1.1rem;
            letter-spacing: 5px;
            color: var(--color-cream);
            text-transform: uppercase;
        }

        .top-bar .counter {
            font-family: var(--font-body);
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--color-cream);
            background: rgba(62, 84, 119, 0.35);
            border: 1px solid rgba(62, 84, 119, 0.6);
            padding: 4px 14px;
            border-radius: 20px;
        }

        /* ── QR 右下角 ── */
        .qr-corner {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .qr-wrap {
            background: rgba(230, 213, 191, 0.95);
            border-radius: 10px;
            padding: 8px;
        }

        .qr-corner p {
            font-family: var(--font-body);
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: var(--color-muted);
            text-transform: uppercase;
        }

        /* ── 日期標記 ── */
        .date-tag {
            position: fixed;
            bottom: 28px;
            left: 28px;
            font-family: var(--font-body);
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(154, 163, 177, 0.6);
            z-index: 10;
        }

        /* ── 上傳按鈕 ── */
        .btn-upload-corner {
            display: inline-block;
            padding: 6px 18px;
            background: rgba(63, 101, 148, 0.35);
            border: 1px solid rgba(62, 84, 119, 0.6);
            border-radius: 20px;
            font-family: var(--font-body);
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--color-cream);
            text-decoration: none;
            text-transform: uppercase;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-upload-corner:hover {
            background: rgba(63, 101, 148, 0.6);
            color: var(--color-cream);
        }

        /* ── 進度條 ── */
        .progress-bar-slide {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--color-blue);
            opacity: 0.8;
            z-index: 10;
            transition: width linear;
        }
    </style>
</head>

<body>
    <div id="app" @touchstart="onTouchStart" @touchend="onTouchEnd">
        <div class="vignette"></div>

        <!-- 空狀態 -->
        <div v-if="photos.length === 0" class="empty-state">
            <div class="script">Sean &amp; Cindy</div>
            <div class="hint">Scan QR Code to upload your photo</div>
        </div>

        <!-- 輪播照片 -->
        <div v-for="(photo, i) in photos" :key="photo.id" class="slide" :class="{ active: i === currentIndex }">
            <img v-if="shouldLoad(i)" :src="photo.url" :alt="photo.name" />
        </div>

        <!-- 頂部列 -->
        <div class="top-bar" v-if="photos.length > 0">
            <div class="couple">Sean &amp; Cindy</div>
            <div class="counter">{{ currentIndex + 1 }} &nbsp;/&nbsp; {{ photos.length }}</div>
        </div>

        <!-- 進度條 -->
        <div v-if="photos.length > 0" class="progress-bar-slide"
            :style="{ width: barWidth + '%', transitionDuration: barDuration + 'ms' }">
        </div>

        <!-- 日期 -->
        <div class="date-tag">2026 &nbsp;·&nbsp; 05 &nbsp;·&nbsp; 30</div>

        <!-- QR Code -->
        <div class="qr-corner">
            <a href="upload.html" class="btn-upload-corner">
                <i class="fa-solid fa-cloud-arrow-up me-1"></i>上傳照片
            </a>
            <div class="qr-wrap">
                <div id="qrcode"></div>
            </div>
            <p>Upload Photo</p>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const uploadURL = GITHUB_PAGES_URL + '/upload.html';
        const INTERVAL = 5000;

        new Vue({
            el: '#app',
            data: {
                photos: [],
                currentIndex: 0,
                knownIds: new Set(),
                timer: null,
                barWidth: 0,
                barDuration: 0,
                touchStartX: 0
            },
            mounted() {
                new QRCode(document.getElementById('qrcode'), {
                    text: uploadURL,
                    width: 90,
                    height: 90,
                    colorDark: '#2d2520',
                    colorLight: '#f0e8dc'
                });

                db.collection('photos')
                    .orderBy('uploadedAt', 'asc')
                    .onSnapshot(snapshot => {
                        snapshot.docChanges().forEach(change => {
                            if (change.type === 'added') {
                                const data = change.doc.data();
                                this.photos.push({
                                    id: change.doc.id,
                                    url: data.url,
                                    name: data.name || '',
                                    uploadedAt: data.uploadedAt
                                });
                                this.knownIds.add(change.doc.id);
                            } else if (change.type === 'removed') {
                                const idx = this.photos.findIndex(p => p.id === change.doc.id);
                                if (idx !== -1) this.photos.splice(idx, 1);
                                if (this.currentIndex >= this.photos.length) this.currentIndex = 0;
                            }
                        });

                        if (this.photos.length > 0 && !this.timer) this.startSlideshow();
                    });
            },
            methods: {
                startSlideshow() {
                    this.runProgress();
                    this.timer = setInterval(() => {
                        this.currentIndex = (this.currentIndex + 1) % this.photos.length;
                        this.runProgress();
                    }, INTERVAL);
                },
                runProgress() {
                    this.barWidth = 0;
                    this.barDuration = 0;
                    this.$nextTick(() => {
                        this.barDuration = INTERVAL;
                        this.barWidth = 100;
                    });
                },
                shouldLoad(i) {
                    const next = (this.currentIndex + 1) % this.photos.length;
                    return i === this.currentIndex || i === next;
                },
                onTouchStart(e) {
                    this.touchStartX = e.touches[0].clientX;
                },
                onTouchEnd(e) {
                    const diff = this.touchStartX - e.changedTouches[0].clientX;
                    if (Math.abs(diff) < 50 || this.photos.length === 0) return;
                    if (diff > 0) {
                        this.currentIndex = (this.currentIndex + 1) % this.photos.length;
                    } else {
                        this.currentIndex = (this.currentIndex - 1 + this.photos.length) % this.photos.length;
                    }
                    clearInterval(this.timer);
                    this.timer = null;
                    this.startSlideshow();
                }
            },
            beforeDestroy() {
                if (this.timer) clearInterval(this.timer);
            }
        });
    </script>
</body>

</html>
